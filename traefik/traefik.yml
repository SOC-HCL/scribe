api:
  dashboard: true
  insecure: true  # Only for development - remove in production

entryPoints:
  web:
    address: "0.0.0.0:80"  # Listen on all interfaces
  websecure:
    address: "0.0.0.0:443"  # Listen on all interfaces
    http:
      tls: {}

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /data/certs/scribe.crt
        keyFile: /data/certs/scribe.key

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: scribe_default

log:
  level: INFO

accessLog: {}