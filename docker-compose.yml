# ── SCRIBE — docker-compose.yml (version open-source) ─────────────────────
# 
# SETUP INSTRUCTIONS:
#   1. Generate certificates (run ONCE before first startup):
#      Windows: .\generate-selfsigned-cert.ps1
#      Linux/Mac: bash ./generate-selfsigned-cert.sh
#   
#   2. Create .env file with your configuration (optional):
#      SCRIBE_HOST=localhost
#      ADMIN_PASSWORD=your-password
#   
#   3. Start services:
#      docker compose up -d
#
# USAGE:
#   docker compose up -d          → first start
#   docker compose down           → stop all services
#   docker compose logs -f        → view logs in real-time
#   docker compose pull && docker compose up -d  → update
#
# ACCESS:
#   HTTP:             http://localhost
#   HTTPS:            https://localhost (self-signed cert)
#   Traefik Dashboard: http://localhost:8080
#   Health Check:     http://localhost:8000/health
#
# PLATFORM SUPPORT:
#   ✓ Windows (Docker Desktop with WSL 2)
#   ✓ Linux (Docker Engine)
#   ✓ macOS (Docker Desktop)
#
# For detailed setup guide, see SETUP_GUIDE.md

services:
  traefik:
    image: traefik:latest
    container_name: scribe-traefik
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"    # Listen on all interfaces (HTTP)
      - "0.0.0.0:443:443"  # Listen on all interfaces (HTTPS)
      - "0.0.0.0:8080:8080" # Dashboard (development only — restrict in production)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/data/certs:ro
      - traefik_data:/data
    networks:
      - scribe_default
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    command:
      - "traefik"
      - "--configFile=/etc/traefik/traefik.yml"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  scribe:
    # image: elched/hospsec:v1.3.3
    build:
      context: ./scribe
      dockerfile: Dockerfile
    container_name: scribe
    restart: on-failure:3
    expose:
      - "8000"
    volumes:
      - scribe_data:/data
    environment:
      - SCRIBE_HOST=${SCRIBE_HOST:-localhost}
      - SCRIBE_IA_PROVIDER=${SCRIBE_IA_PROVIDER:-albert}
      - SCRIBE_IA_KEY=${SCRIBE_IA_KEY:-}
      - SCRIBE_IA_MODEL=${SCRIBE_IA_MODEL:-}
      - SCRIBE_IA_URL=${SCRIBE_IA_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SCRIBE_SECRET=${SCRIBE_SECRET:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Scribe2026!}
      # We include the host IP/name in the allowed CORS origins to prevent browser blocks
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://localhost,http://${SCRIBE_HOST:-localhost},https://${SCRIBE_HOST:-localhost}}
      - SCRIBE_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scribe_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scribe.rule=PathPrefix(`/`)"
      - "traefik.http.routers.scribe.priority=1"
      - "traefik.http.routers.scribe.entrypoints=web,websecure"
      - "traefik.http.routers.scribe.service=scribe"
      - "traefik.http.services.scribe.loadbalancer.server.port=8000"
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

volumes:
  scribe_data:
    driver: local
  traefik_data:
    driver: local

networks:
  scribe_default:
    driver: bridge
    name: scribe_default
